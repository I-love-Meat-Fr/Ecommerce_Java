<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name}">Chi tiết sản phẩm - CNJ70</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/web-header"></div>
    
    <main class="main-content">
        <div class="container">
            <div class="product-detail">
                <div class="product-images">
                    <img th:src="${product.thumbnailUrl ?: '/images/placeholder.jpg'}" alt="${product.name}">
                </div>
                <div class="product-info">
                    <h1 th:text="${product.name}">Tên sản phẩm</h1>
                    <p class="shop-name">
                        <i class="fas fa-store"></i>
                        <span th:text="${product.shopName}">Tên shop</span>
                    </p>
                    <p class="price" th:text="${@money.format(product.price)}">0đ</p>
                    <p class="stock">
                        <i class="fas fa-box"></i>
                        Còn lại: <span th:text="${product.stock}">0</span> sản phẩm
                    </p>
                    <p class="rating">
                        <i class="fas fa-star"></i>
                        <span th:text="${product.rating}">0</span>/5 
                        (<span th:text="${product.reviewCount}">0</span> đánh giá)
                    </p>
                    
                    <div class="product-actions">
                        <form th:action="@{/cart/add}" method="post" sec:authorize="isAuthenticated()">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <div class="quantity-selector">
                                <label>Số lượng:</label>
                                <input type="number" name="quantity" value="1" min="1" max="${product.stock}">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-cart-plus"></i> Thêm vào giỏ hàng
                            </button>
                        </form>
                        <a sec:authorize="!isAuthenticated()" th:href="@{/auth/login}" class="btn btn-primary">
                            Đăng nhập để mua hàng
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="product-description">
                <h2>Mô tả sản phẩm</h2>
                <p th:text="${product.description}">Mô tả sản phẩm</p>
            </div>
        </div>
    </main>
    
    <div th:replace="fragments/web-footer"></div>
</body>
</html>
