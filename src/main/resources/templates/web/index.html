<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - CNJ70 Ecommerce</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/web-header"></div>
    
    <main class="main-content">
        <section class="hero">
            <div class="container">
                <h1>Chào mừng đến với CNJ70 Ecommerce</h1>
                <p>Nền tảng thương mại điện tử đa nhà bán hàng đầu</p>
                <a th:href="@{/products}" class="btn btn-primary">Xem sản phẩm</a>
            </div>
        </section>
        
        <section class="products-section">
            <div class="container">
                <h2>Sản phẩm nổi bật</h2>
                <div class="product-grid">
                    <div th:each="product : ${products}" class="product-card">
                        <a th:href="@{/products/{id}(id=${product.id})}">
                            <img th:src="${product.thumbnailUrl ?: '/images/placeholder.jpg'}" alt="${product.name}">
                            <h3 th:text="${product.name}">Tên sản phẩm</h3>
                            <p class="price" th:text="${@money.format(product.price)}">0đ</p>
                            <p class="shop-name" th:text="${product.shopName}">Tên shop</p>
                        </a>
                        <form th:action="@{/cart/add}" method="post" sec:authorize="isAuthenticated()">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <button type="submit" class="btn btn-secondary">Thêm vào giỏ</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <div th:replace="fragments/web-footer"></div>
    
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
