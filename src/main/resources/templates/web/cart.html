<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - CNJ70 Ecommerce</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/web-header"></div>
    
    <main class="main-content">
        <div class="container">
            <h1>Giỏ hàng của bạn</h1>
            
            <div th:if="${cart != null and not #lists.isEmpty(cart.items)}">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cart.items}">
                            <td class="cart-item">
                                <img th:src="${item.imageUrl ?: 'https://placehold.co/80x80/f1f5f9/94a3b8?text=No+Img'}" th:alt="${item.productName}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;">
                                <span th:text="${item.productName}">Tên sản phẩm</span>
                            </td>
                            <td th:text="${@money.format(item.price)}">0đ</td>
                            <td>
                                <form th:action="@{/cart/update}" method="post" class="quantity-form">
                                    <input type="hidden" name="productId" th:value="${item.productId}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="1">
                                    <button type="submit">Cập nhật</button>
                                </form>
                            </td>
                            <td th:text="${@money.format(item.subtotal)}">0đ</td>
                            <td>
                                <form th:action="@{/cart/remove}" method="post">
                                    <input type="hidden" name="productId" th:value="${item.productId}">
                                    <button type="submit" class="btn-remove">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="cart-summary">
                    <a th:href="@{/checkout}" class="btn btn-primary">Tiến hành thanh toán</a>
                </div>
            </div>
            
            <div th:if="${cart == null or #lists.isEmpty(cart.items)}" class="empty-cart">
                <i class="fas fa-shopping-cart"></i>
                <p>Giỏ hàng trống</p>
                <a th:href="@{/products}" class="btn btn-primary">Tiếp tục mua sắm</a>
            </div>
        </div>
    </main>
    
    <div th:replace="fragments/web-footer"></div>
</body>
</html>
