<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đơn hàng - CNJ70 Ecommerce</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/web-header"></div>
    
    <main class="main-content">
        <div class="container">
            <h1>Lịch sử đơn hàng</h1>
            
            <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
                <i class="fas fa-receipt"></i>
                <p>Bạn chưa có đơn hàng nào</p>
                <a th:href="@{/products}" class="btn btn-primary">Mua sắm ngay</a>
            </div>
            
            <div th:if="${not #lists.isEmpty(orders)}" class="order-list">
                <div th:each="order : ${orders}" class="order-card">
                    <div class="order-header">
                        <span class="order-id">Đơn hàng #<span th:text="${order.orderId}"></span></span>
                        <span class="order-date" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                    <div class="order-details">
                        <div class="order-images">
                            <img th:each="img : ${order.productImages}" th:src="${img}" alt="">
                        </div>
                        <div class="order-info">
                            <p>Số sản phẩm: <span th:text="${order.itemCount}">0</span></p>
                            <p class="order-total">Tổng: <strong th:text="${@money.format(order.totalAmount)}">0đ</strong></p>
                        </div>
                        <div class="order-status">
                            <span class="status-badge" th:classappend="${order.status.name()}" 
                                  th:text="${order.status.name()}">PENDING</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="fragments/web-footer"></div>
</body>
</html>
