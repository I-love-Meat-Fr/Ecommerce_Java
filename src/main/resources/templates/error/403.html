<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Không có quyền truy cập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="error-page">
        <h1>403</h1>
        <h2>Bạn không có quyền truy cập trang này</h2>
        <p th:text="${error} ?: 'Vui lòng đăng nhập bằng tài khoản có quyền phù hợp hoặc liên hệ quản trị viên.'">Vui lòng đăng nhập hoặc liên hệ quản trị viên.</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <a th:href="@{/home}" class="btn btn-primary">Về trang chủ</a>
            <a th:href="@{/auth/login}" class="btn btn-secondary">Đăng nhập</a>
        </div>
    </div>
</body>
</html>
