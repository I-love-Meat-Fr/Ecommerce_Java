<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Lỗi server</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="error-page">
        <h1>500</h1>
        <h2>Đã xảy ra lỗi</h2>
        <p th:text="${error} ?: 'Đã có lỗi xảy ra trong quá trình xử lý. Vui lòng thử lại sau.'">Đã có lỗi xảy ra trong quá trình xử lý.</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <a th:href="@{/home}" class="btn btn-primary">Về trang chủ</a>
            <a th:href="@{/auth/login}" class="btn btn-secondary">Đăng nhập</a>
        </div>
    </div>
</body>
</html>
