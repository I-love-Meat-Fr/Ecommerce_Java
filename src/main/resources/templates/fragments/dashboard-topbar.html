<div class="sd-topbar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
    <button class="sd-topbar-toggle" type="button" id="sidebarToggle" aria-label="Mở menu">
        <i class="fas fa-bars"></i>
    </button>

    <div class="sd-topbar-search">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" placeholder="Tìm kiếm sản phẩm, đơn hàng...">
    </div>

    <div class="sd-topbar-actions">
        <button class="sd-icon-btn" type="button" aria-label="Thông báo">
            <i class="fas fa-bell"></i>
            <span class="sd-icon-btn-dot"></span>
        </button>
        <button class="sd-icon-btn" type="button" aria-label="Trợ giúp">
            <i class="fas fa-circle-question"></i>
        </button>

        <div class="sd-topbar-divider"></div>

        <div class="sd-topbar-profile">
            <div class="sd-topbar-avatar" sec:authentication="name">U</div>
            <span class="sd-topbar-profile-name" sec:authentication="name">User</span>
        </div>
    </div>
</div>
