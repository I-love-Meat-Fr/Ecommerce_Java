<header class="home-header" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
    <div class="container">
        <div class="home-header-inner">

            <!-- Logo -->
            <div class="home-logo">
                <a th:href="@{/home}" id="logo-link" class="home-logo-link">
                    <div class="home-logo-icon">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div class="home-logo-text">
                        <span class="home-logo-brand">CNJ70</span>
                        <span class="home-logo-sub">Shop</span>
                    </div>
                </a>
            </div>

            <!-- Center: Nav Links -->
            <nav class="home-nav" aria-label="Điều hướng chính">
                <a th:href="@{/home}" id="nav-home" class="home-nav-link">
                    <i class="fas fa-home home-nav-icon"></i>
                    <span>Trang chủ</span>
                </a>
                <a th:href="@{/products}" id="nav-products" class="home-nav-link">
                    <i class="fas fa-th-large home-nav-icon"></i>
                    <span>Sản phẩm</span>
                </a>
                <a th:href="@{/orders}" id="nav-orders" class="home-nav-link">
                    <i class="fas fa-receipt home-nav-icon"></i>
                    <span>Đơn hàng</span>
                </a>
                <a th:href="@{/cart}" id="nav-cart" class="home-nav-link">
                    <i class="fas fa-shopping-cart home-nav-icon"></i>
                    <span>Giỏ hàng</span>
                    <span class="nav-cart-badge" th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}">0</span>
                </a>
            </nav>

            <!-- Right: Actions -->
            <div class="home-header-actions">
                <!-- Logged in: icons row -->
                <div sec:authorize="isAuthenticated()" class="home-authenticated">
                    <a th:href="@{/cart}" class="home-icon-btn" title="Giỏ hàng" id="cart-btn">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="nav-cart-badge" th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}">0</span>
                    </a>
                    <a th:href="@{/orders}" class="home-icon-btn" title="Đơn hàng" id="orders-btn">
                        <i class="fas fa-receipt"></i>
                    </a>
                    <a th:href="@{/vendor}" sec:authorize="hasRole('VENDOR')" class="home-icon-btn home-icon-btn-vendor" title="Quản lý Shop" id="vendor-btn">
                        <i class="fas fa-store"></i>
                        <span class="home-icon-label">Kênh người bán</span>
                    </a>
                    <div class="home-user-menu">
                        <button class="home-user-btn" id="user-menu-btn">
                            <div class="home-user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <i class="fas fa-chevron-down home-user-arrow"></i>
                        </button>
                        <div class="home-user-dropdown" id="user-dropdown">
                            <div class="home-user-dropdown-header">
                                <div class="home-user-name" sec:authorize="isAuthenticated()" th:text="${#authentication.name}">Username</div>
                                <div class="home-user-email">Xem và chỉnh sửa hồ sơ</div>
                            </div>
                            <div class="home-user-dropdown-divider"></div>
                            <a th:href="@{/orders}" class="home-dropdown-item">
                                <i class="fas fa-receipt"></i> Đơn hàng của tôi
                            </a>
                            <a th:href="@{/cart}" class="home-dropdown-item">
                                <i class="fas fa-shopping-cart"></i> Giỏ hàng
                            </a>
                            <a th:href="@{/vendor}" sec:authorize="hasRole('VENDOR')" class="home-dropdown-item">
                                <i class="fas fa-store"></i> Kênh người bán
                            </a>
                            <div class="home-user-dropdown-divider"></div>
                            <form th:action="@{/auth/logout}" method="post">
                                <button type="submit" class="home-dropdown-item home-dropdown-item-danger" id="logout-btn">
                                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Logged out -->
                <div sec:authorize="!isAuthenticated()" class="home-auth-guest">
                    <a class="home-btn-login" th:href="@{/auth/login}" id="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </a>
                    <a class="home-btn-register" th:href="@{/auth/register}" id="register-btn">
                        <i class="fas fa-user-plus"></i> Đăng ký
                    </a>
                </div>
            </div>

            <!-- Mobile Hamburger -->
            <button class="home-hamburger" id="home-hamburger-btn" aria-label="Mở menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="home-mobile-menu" id="home-mobile-menu">
            <div class="home-mobile-menu-header">
                <div class="home-mobile-logo">
                    <i class="fas fa-shopping-bag"></i>
                    <span>CNJ70 Shop</span>
                </div>
                <button class="home-mobile-close" id="home-mobile-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="home-mobile-nav">
                <a th:href="@{/home}" class="home-mobile-nav-link">
                    <i class="fas fa-home"></i> Trang chủ
                </a>
                <a th:href="@{/products}" class="home-mobile-nav-link">
                    <i class="fas fa-th-large"></i> Sản phẩm
                </a>
                <a th:href="@{/orders}" class="home-mobile-nav-link">
                    <i class="fas fa-receipt"></i> Đơn hàng
                </a>
                <a th:href="@{/cart}" class="home-mobile-nav-link">
                    <i class="fas fa-shopping-cart"></i> Giỏ hàng
                    <span class="nav-cart-badge" th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}">0</span>
                </a>
            </nav>
            <div sec:authorize="isAuthenticated()" class="home-mobile-auth">
                <form th:action="@{/auth/logout}" method="post">
                    <button type="submit" class="home-mobile-logout">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()" class="home-mobile-auth">
                <a class="home-mobile-login" th:href="@{/auth/login}">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập
                </a>
                <a class="home-mobile-register" th:href="@{/auth/register}">
                    <i class="fas fa-user-plus"></i> Đăng ký
                </a>
            </div>
        </div>
    </div>
</header>
