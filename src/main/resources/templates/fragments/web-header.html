<header class="header" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <a th:href="@{/home}" id="logo-link">
                    <span class="logo-icon">
                        <i class="fas fa-shopping-bag"></i>
                    </span>
                    <span class="logo-text">CNJ70 <span>Shop</span></span>
                </a>
            </div>
            
            <form th:action="@{/products}" method="get" class="header-search" id="search-form">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" name="search" placeholder="Tìm kiếm sản phẩm..." aria-label="Tìm kiếm sản phẩm">
                    <button type="submit" class="search-btn" id="search-btn">
                        <i class="fas fa-search"></i>
                        <span>Tìm kiếm</span>
                    </button>
                </div>
            </form>
            
            <nav class="nav" aria-label="Điều hướng chính">
                <a th:href="@{/home}" id="nav-home">
                    <i class="fas fa-home"></i>
                    <span>Trang chủ</span>
                </a>
                <a th:href="@{/products}" id="nav-products">
                    <i class="fas fa-th-large"></i>
                    <span>Sản phẩm</span>
                </a>
            </nav>
            
            <div class="header-actions">
                <div sec:authorize="isAuthenticated()" class="user-menu">
                    <a th:href="@{/cart}" class="header-icon-btn" title="Giỏ hàng" id="cart-btn">
                        <i class="fas fa-shopping-cart" aria-hidden="true"></i>
                        <span>Giỏ hàng</span>
                    </a>
                    <a th:href="@{/orders}" class="header-icon-btn" title="Đơn hàng" id="orders-btn">
                        <i class="fas fa-receipt" aria-hidden="true"></i>
                        <span>Đơn hàng</span>
                    </a>
                    <a th:href="@{/vendor}" sec:authorize="hasRole('VENDOR')" class="header-icon-btn" title="Quản lý Shop" id="vendor-btn">
                        <i class="fas fa-store" aria-hidden="true"></i>
                        <span>Shop</span>
                    </a>
                    <form th:action="@{/auth/logout}" method="post" class="logout-form">
                        <button type="submit" class="header-icon-btn" id="logout-btn">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Đăng xuất</span>
                        </button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()" class="auth-actions">
                    <a class="btn btn-primary btn-sm header-cta" th:href="@{/auth/login}" id="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </a>
                    <a class="btn btn-secondary btn-sm" th:href="@{/auth/register}" id="register-btn">Đăng ký</a>
                </div>
            </div>
        </div>
    </div>
</header>
