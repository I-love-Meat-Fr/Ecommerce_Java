<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:fragment="layout(title, content, scripts, pageStyles)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CNJ70 Shop - Sàn thương mại điện tử đa nhà bán hàng hàng đầu Việt Nam.">
    <title th:text="${title} ?: 'CNJ70 Shop'">CNJ70 Shop</title>

    <!-- PERFORMANCE #3 — Self-host Google Fonts thay vì load qua CDN.
         Loại bỏ 2 round-trip tới fonts.googleapis.com + fonts.gstatic.com
         và render-blocking CSS của Google. -->
    <link rel="preload" href="/vendor/fonts/worksans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/work-sans.css}">

    <!-- ============================================================
         UI PHASE 4 — Customer / Web UI Revolution
         Customer-specific layout. KHÔNG đụng admin-layout / vendor-layout.
         Load order quan trọng:
           1. style.css               : global tokens + base
           2. home.css                : shared Customer component styles
           3. PAGE-SPECIFIC CSS       : injected via {pageStyles} slot
           4. foundation/index.css    : Design System foundation (Phase 1)
           5. web-ui.css              : Customer UI polish + a11y + responsive
         Tailwind CDN giữ nguyên (đã có sẵn — KHÔNG thêm dependency mới).
         ============================================================ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            blockContainer: true,
            corePlugins: {
                preflight: false,
                container: false
            },
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Work Sans', 'Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <th:block th:replace="${pageStyles} ?: ~{}"></th:block>
    <link rel="stylesheet" th:href="@{/css/foundation/index.css}">
    <link rel="stylesheet" th:href="@{/css/web-ui.css}">
    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
</head>
<body>
    <a class="wb-skip-link" href="#main-content">Bỏ qua tới nội dung chính</a>

    <div th:replace="~{fragments/web-header}"></div>

    <main id="main-content" class="main-content" th:replace="${content}"></main>

    <div th:replace="~{fragments/web-footer}"></div>

    <script th:src="@{/js/main.js}"></script>
    <!-- PERFORMANCE #7 — code-split home.js:
         home-core.js   (above-the-fold): banner, navbar, tabs, scroll reveal — load ngay
         home-flash.js  (mid-fold):       flash countdown + marquee — idle callback
         home-deferred.js (below-fold):   count-up, FAQ, activity, favorite, quick view — idle
         Tổng còn 3 file nhỏ thay vì 1 file 28KB render-blocking. -->
    <script th:src="@{/js/home-core.js}" defer></script>
    <script th:src="@{/js/home-flash.js}" defer></script>
    <script th:src="@{/js/home-deferred.js}" defer></script>
    <th:block th:replace="${scripts} ?: ~{}"></th:block>
</body>
</html>
