<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:fragment="layout(title, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Dashboard - CNJ70'">Dashboard - CNJ70</title>

    <!-- PERFORMANCE #3 -->
<link rel="preload" href="/vendor/fonts/worksans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/work-sans.css">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
</head>
<body>
    <a class="sd-skip-link" href="#mainContent">Bỏ qua tới nội dung chính</a>
    <div class="sd-app" id="appShell">
        <aside th:replace="~{fragments/dashboard-sidebar :: sidebar}"></aside>
        <aside th:replace="~{fragments/admin-sidebar :: sidebar}" th:if="${isAdmin == true}"></aside>

        <div class="sd-main">
            <div th:replace="~{fragments/dashboard-topbar :: topbar}"></div>

            <main class="sd-content" id="mainContent" th:replace="${content}"></main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        (function() {
            const shell = document.getElementById('appShell');
            const toggle = document.getElementById('sidebarToggle');
            const STORAGE_KEY = 'cnj70-sidebar-expanded';

            const persisted = localStorage.getItem(STORAGE_KEY);
            if (persisted === '1') shell.classList.add('sidebar-expanded');

            toggle?.addEventListener('click', () => {
                shell.classList.toggle('sidebar-expanded');
                localStorage.setItem(STORAGE_KEY, shell.classList.contains('sidebar-expanded') ? '1' : '0');
            });

            const path = window.location.pathname.replace(/\/$/, '');
            document.querySelectorAll('.sd-nav-item[data-match]').forEach(el => {
                const match = el.getAttribute('data-match');
                if (match && (path === match || path.startsWith(match + '/'))) {
                    el.classList.add('active');
                }
            });

            document.querySelectorAll('.sd-sidebar-avatar, .sd-topbar-avatar').forEach(el => {
                const name = (el.textContent || '').trim();
                if (!name) return;
                el.textContent = name.charAt(0).toUpperCase();
            });
        })();
    </script>
    <th:block th:replace="${scripts} ?: ~{}"></th:block>
</body>
</html>
</html>
