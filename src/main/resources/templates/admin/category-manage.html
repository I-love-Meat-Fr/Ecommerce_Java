<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/admin-layout :: layout(title='Quản lý danh mục - CNJ70 Admin', content=~{::main-content}, scripts=~{::page-scripts})}">
<head>
    <title>Quản lý danh mục - CNJ70 Admin</title>
</head>
<body>
<main th:fragment="main-content">
    <div class="sd-page-head">
        <div class="sd-page-head-title">
            <h1>Quản lý danh mục</h1>
            <p>Thêm, sửa, xóa các danh mục sản phẩm trong hệ thống.</p>
        </div>
        <div class="sd-page-head-actions">
            <span class="sd-badge sd-badge-slate">
                <i class="fas fa-tags"></i>
                <span th:text="${#lists.size(categories)} + ' danh mục'">0</span>
            </span>
        </div>
    </div>

    <div class="sd-card" style="margin-bottom:20px;">
        <div class="sd-card-head">
            <div>
                <h3><i class="fas fa-plus-circle"></i> Thêm danh mục mới</h3>
                <p>Tạo danh mục sản phẩm mới cho hệ thống</p>
            </div>
        </div>
        <div class="sd-card-body">
            <form th:action="@{/admin/categories/create}" method="post">
                <div style="display:grid;grid-template-columns:1fr 2fr auto;gap:12px;align-items:flex-end;">
                    <div class="sd-form-group" style="margin:0;">
                        <label for="cat-name">Tên danh mục</label>
                        <input type="text" id="cat-name" name="name" class="sd-form-control"
                               placeholder="Ví dụ: Thời trang nam" required>
                    </div>
                    <div class="sd-form-group" style="margin:0;">
                        <label for="cat-desc">Mô tả</label>
                        <input type="text" id="cat-desc" name="description" class="sd-form-control"
                               placeholder="Mô tả ngắn (tùy chọn)">
                    </div>
                    <button type="submit" class="sd-btn sd-btn-primary">
                        <i class="fas fa-plus"></i> Thêm danh mục
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="sd-card">
        <div class="sd-card-body sd-card-body-flush">
            <table class="sd-table">
                <thead>
                    <tr>
                        <th>Tên danh mục</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th style="text-align:right;">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="4">
                            <div class="sd-empty">
                                <i class="fas fa-tags"></i>
                                <h3>Chưa có danh mục</h3>
                                <p>Tạo danh mục đầu tiên cho hệ thống.</p>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="category : ${categories}">
                        <td>
                            <div class="sd-table-title" th:text="${category.name}">Tên danh mục</div>
                        </td>
                        <td>
                            <div class="sd-table-sub" th:text="${category.description} ?: '—'">Mô tả</div>
                        </td>
                        <td>
                            <span class="sd-badge"
                                  th:classappend="${category.active ? 'sd-badge-green' : 'sd-badge-slate'}"
                                  th:text="${category.active ? 'Hoạt động' : 'Tạm khóa'}">Hoạt động</span>
                        </td>
                        <td style="text-align:right;">
                            <form th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">
                                <button type="submit" class="sd-btn sd-btn-secondary sd-btn-sm">
                                    <i class="fas fa-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:fragment="page-scripts"></th:block>
</body>
</html>
