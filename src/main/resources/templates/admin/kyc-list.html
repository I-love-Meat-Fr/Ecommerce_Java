<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/admin-layout :: layout(title='Duyệt KYC - CNJ70 Admin', content=~{::main-content}, scripts=~{::page-scripts})}">
<head>
    <title>Duyệt KYC - CNJ70 Admin</title>
</head>
<body>
<main th:fragment="main-content">

    <!-- Page Hero -->
    <div class="vd-page-hero">
        <div class="vd-page-hero-left">
            <div class="vd-page-hero-icon"><i class="fas fa-shield-halved"></i></div>
            <div class="vd-page-hero-info">
                <h2>Duyệt hồ sơ KYC</h2>
                <p>Xác minh danh tính nhà bán trước khi cho phép tạo shop.</p>
            </div>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="kyc-stats">
        <div class="kyc-stat kyc-stat-warn">
            <div class="kyc-stat-label">Chờ admin duyệt</div>
            <div class="kyc-stat-value" th:text="${stats != null ? (stats['PENDING_ADMIN'] ?: 0) : 0}">0</div>
        </div>
        <div class="kyc-stat kyc-stat-info">
            <div class="kyc-stat-label">Chờ bên thứ ba</div>
            <div class="kyc-stat-value" th:text="${stats != null ? (stats['PENDING_THIRD_PARTY'] ?: 0) : 0}">0</div>
        </div>
        <div class="kyc-stat kyc-stat-green">
            <div class="kyc-stat-label">Đã duyệt</div>
            <div class="kyc-stat-value" th:text="${stats != null ? (stats['APPROVED'] ?: 0) : 0}">0</div>
        </div>
        <div class="kyc-stat kyc-stat-red">
            <div class="kyc-stat-label">Bị từ chối</div>
            <div class="kyc-stat-value" th:text="${(stats != null ? (stats['ADMIN_REJECTED'] ?: 0) : 0) + (stats != null ? (stats['THIRD_PARTY_REJECTED'] ?: 0) : 0)}">0</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="sd-card" style="margin-bottom: 16px;">
        <div class="sd-card-body" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <form th:action="@{/admin/kyc}" method="get" style="display: flex; gap: 12px; flex: 1; align-items: center;">
                <input type="search" name="q" th:value="${searchQuery}" placeholder="Tìm theo tên chủ shop..."
                       class="sd-form-control" style="flex: 1; max-width: 300px;">
                <select name="status" class="sd-form-control" onchange="this.form.submit()" style="max-width: 220px;">
                    <option value="PENDING_ADMIN" th:selected="${currentStatus == 'PENDING_ADMIN'}">Chờ admin duyệt</option>
                    <option value="PENDING_THIRD_PARTY" th:selected="${currentStatus == 'PENDING_THIRD_PARTY'}">Chờ bên thứ ba</option>
                    <option value="APPROVED" th:selected="${currentStatus == 'APPROVED'}">Đã duyệt</option>
                    <option value="THIRD_PARTY_REJECTED" th:selected="${currentStatus == 'THIRD_PARTY_REJECTED'}">Bên thứ ba từ chối</option>
                    <option value="ADMIN_REJECTED" th:selected="${currentStatus == 'ADMIN_REJECTED'}">Admin từ chối</option>
                    <option value="SUSPENDED" th:selected="${currentStatus == 'SUSPENDED'}">Bị đình chỉ</option>
                    <option value="ALL" th:selected="${currentStatus == 'ALL'}">Tất cả</option>
                </select>
                <button type="submit" class="sd-btn sd-btn-cta">
                    <i class="fas fa-search"></i> Tìm
                </button>
            </form>
        </div>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="sd-alert sd-alert-success"><i class="fas fa-circle-check"></i><span th:text="${success}"></span></div>
    <div th:if="${error}" class="sd-alert sd-alert-danger"><i class="fas fa-triangle-exclamation"></i><span th:text="${error}"></span></div>

    <!-- Table -->
    <div class="sd-card">
        <div class="sd-card-body" style="padding: 0;">
            <table class="sd-table">
                <thead>
                    <tr>
                        <th>Vendor</th>
                        <th>Email</th>
                        <th>CCCD</th>
                        <th>Ngân hàng</th>
                        <th>Số lần gửi</th>
                        <th>Trạng thái</th>
                        <th>Ngày gửi</th>
                        <th style="text-align: right;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <div class="sd-avatar-sm" th:text="${row.user != null and row.user.fullName != null ? row.user.fullName.substring(0,1).toUpperCase() : '?'}">V</div>
                                <div>
                                    <div style="font-weight: 500;" th:text="${row.profile.ownerFullName ?: '—'}">—</div>
                                    <div style="font-size: 0.8rem; color: #6c757d;" th:text="${row.user != null ? row.user.fullName : ''}">—</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${row.user != null ? row.user.email : '—'}">—</td>
                        <td>
                            <code class="kyc-mask"
                                  th:text="${T(com.ecommerce.cnj70.util.KycMaskUtil).maskCccd(row.profile.idNumber)}">***</code>
                        </td>
                        <td>
                            <div th:text="${row.profile.bankName}">—</div>
                            <small style="color: #6c757d;"
                                   class="kyc-mask"
                                   th:text="${T(com.ecommerce.cnj70.util.KycMaskUtil).maskBankAccount(row.profile.bankAccount)}">***</small>
                        </td>
                        <td th:text="${row.profile.submitCount ?: 1}">1</td>
                        <td>
                            <span class="sd-badge" th:classappend="
                                ${row.profile.status.name() == 'APPROVED' ? 'sd-badge-green' : ''} +
                                ${row.profile.status.name() == 'PENDING_ADMIN' ? 'sd-badge-indigo' : ''} +
                                ${row.profile.status.name() == 'PENDING_THIRD_PARTY' ? 'sd-badge-amber' : ''} +
                                ${row.profile.status.name() == 'THIRD_PARTY_REJECTED' ? 'sd-badge-red' : ''} +
                                ${row.profile.status.name() == 'ADMIN_REJECTED' ? 'sd-badge-red' : ''} +
                                ${row.profile.status.name() == 'SUSPENDED' ? 'sd-badge-gray' : ''}"
                                  th:text="${row.profile.status}">
                            </span>
                        </td>
                        <td th:text="${row.profile.submittedAt != null ? #temporals.format(row.profile.submittedAt, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
                        <td style="text-align: right;">
                            <a th:href="@{/admin/kyc/{id}(id=${row.profile.id})}" class="sd-btn sd-btn-secondary sd-btn-sm">
                                <i class="fas fa-eye"></i> Xem
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="8" style="text-align: center; padding: 40px; color: #6c757d;">
                            <i class="fas fa-inbox" style="font-size: 2rem; margin-bottom: 12px; display: block;"></i>
                            Không có hồ sơ nào
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" style="margin-top: 16px; display: flex; justify-content: center; gap: 8px;">
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/kyc(page=${currentPage - 1}, size=${pageSize}, q=${searchQuery}, status=${currentStatus})}"
           class="sd-btn sd-btn-secondary sd-btn-sm">
            <i class="fas fa-chevron-left"></i> Trước
        </a>
        <span class="sd-btn sd-btn-secondary sd-btn-sm" style="pointer-events: none;">
            Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>
        </span>
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/kyc(page=${currentPage + 1}, size=${pageSize}, q=${searchQuery}, status=${currentStatus})}"
           class="sd-btn sd-btn-secondary sd-btn-sm">
            Sau <i class="fas fa-chevron-right"></i>
        </a>
    </div>

</main>

<th:block th:fragment="page-scripts">
<style>
.kyc-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}
.kyc-stat {
    padding: 16px;
    border-radius: 8px;
    color: #fff;
}
.kyc-stat-warn { background: linear-gradient(135deg, #ffc107, #ff9800); }
.kyc-stat-info { background: linear-gradient(135deg, #17a2b8, #138496); }
.kyc-stat-green { background: linear-gradient(135deg, #28a745, #218838); }
.kyc-stat-red { background: linear-gradient(135deg, #dc3545, #c82333); }
.kyc-stat-label {
    font-size: 0.85rem;
    opacity: 0.9;
}
.kyc-stat-value {
    font-size: 1.8rem;
    font-weight: 700;
    margin-top: 4px;
}
.sd-avatar-sm {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #0d6efd;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
}
.sd-btn-sm {
    padding: 6px 12px;
    font-size: 0.85rem;
}
/* Mask dữ liệu nhạy cảm */
.kyc-mask {
    background: #f0f4f8;
    border: 1px solid #d6e0ea;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
    color: #495057;
    letter-spacing: 1px;
}
</style>
</th:block>
</body>
</html>
