<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CNJ70</title>
    <link rel="stylesheet" th:href="@{/css/admin-vendor.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>CNJ70 Admin</h2>
            <nav>
                <a th:href="@{/admin/dashboard}"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a th:href="@{/admin/users}"><i class="fas fa-users"></i> Người dùng</a>
                <a th:href="@{/admin/categories}"><i class="fas fa-tags"></i> Danh mục</a>
            </nav>
        </div>
        <div class="main-content">
            <main class="dashboard-content">
                <h1>Dashboard</h1>
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-users"></i>
                        <h3>Người dùng</h3>
                        <p class="stat-value">0</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-store"></i>
                        <h3>Cửa hàng</h3>
                        <p class="stat-value">0</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-box"></i>
                        <h3>Sản phẩm</h3>
                        <p class="stat-value">0</p>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
