<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - CNJ70 Ecommerce</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>CNJ70 Ecommerce</h1>
            <h2>Đăng ký tài khoản</h2>
            
            <div th:if="${error}" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/auth/register}" th:object="${registerReq}" method="post">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" th:field="*{email}" required placeholder="Nhập email">
                    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu *</label>
                    <input type="password" id="password" th:field="*{password}" required minlength="6" placeholder="Ít nhất 6 ký tự">
                    <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                
                <div class="form-group">
                    <label for="fullName">Họ và tên *</label>
                    <input type="text" id="fullName" th:field="*{fullName}" required placeholder="Nhập họ tên đầy đủ">
                    <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>
                
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="Nhập số điện thoại">
                </div>
                
                <div class="form-group">
                    <label for="address">Địa chỉ</label>
                    <input type="text" id="address" th:field="*{address}" placeholder="Nhập địa chỉ">
                </div>
                
                <div class="form-group">
                    <label for="role">Loại tài khoản</label>
                    <select id="role" th:field="*{role}">
                        <option value="CUSTOMER">Khách hàng</option>
                        <option value="VENDOR">Nhà bán hàng</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Đăng ký</button>
            </form>
            
            <div class="auth-links">
                <p>Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a></p>
            </div>
        </div>
    </div>
</body>
</html>
