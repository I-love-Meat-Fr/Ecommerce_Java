<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CNJ70 Ecommerce</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>CNJ70 Ecommerce</h1>
            <h2>Đăng nhập</h2>
            
            <div th:if="${param.error != null or error != null}" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:if="${error}" th:text="${error}">Đăng nhập thất bại</span>
                <span th:unless="${error}">Email hoặc mật khẩu không đúng</span>
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                Bạn đã đăng xuất thành công
            </div>
            
            <form th:action="@{/auth/login}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Nhập email của bạn">
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu">
                </div>
                
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </form>
            
            <div class="auth-links">
                <p>Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>
</body>
</html>
