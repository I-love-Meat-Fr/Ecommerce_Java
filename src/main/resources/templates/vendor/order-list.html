<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - CNJ70 Vendor</title>
    <link rel="stylesheet" th:href="@{/css/admin-vendor.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div th:replace="~{fragments/dashboard-sidebar}"></div>
        <div class="main-content">
            <div th:replace="~{fragments/dashboard-topbar}"></div>
            <main class="dashboard-content">
                <div class="content-header">
                    <h1>Quản lý đơn hàng</h1>
                </div>
                
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                
                <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
                    <i class="fas fa-shopping-bag"></i>
                    <h3>Chưa có đơn hàng nào</h3>
                    <p>Khi có đơn hàng, bạn sẽ thấy danh sách tại đây.</p>
                </div>
                
                <table th:unless="${#lists.isEmpty(orders)}" class="data-table">
                    <thead>
                        <tr>
                            <th>Mã đơn hàng</th>
                            <th>Khách hàng</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền (của bạn)</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td><strong th:text="${order.orderId}">ID</strong></td>
                            <td>
                                <div th:text="${order.userName}">Tên khách</div>
                                <small th:text="${order.userPhone}">SĐT</small>
                            </td>
                            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày</td>
                            <td th:text="${@money.format(order.subtotal)}">0đ</td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${order.status.name() == 'PENDING' ? 'status-warning' : 
                                                       (order.status.name() == 'PROCESSING' ? 'status-info' : 
                                                       (order.status.name() == 'DELIVERED' ? 'status-success' : 
                                                       (order.status.name() == 'CANCELLED' ? 'status-danger' : '')))}"
                                      th:text="${order.status}">STATUS</span>
                            </td>
                            <td>
                                <a th:href="@{/vendor/orders/{id}(id=${order.orderId})}" class="btn-sm btn-primary">
                                    <i class="fas fa-eye"></i> Xem
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </main>
        </div>
    </div>
</body>
</html>
