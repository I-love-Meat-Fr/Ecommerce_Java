<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'}">Sản phẩm - CNJ70</title>
    <link rel="stylesheet" th:href="@{/css/admin-vendor.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div th:replace="fragments/dashboard-sidebar"></div>
        <div class="main-content">
            <div th:replace="fragments/dashboard-topbar"></div>
            <main class="dashboard-content">
                <h1 th:text="${product != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'}">Sản phẩm</h1>
                
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                
                <form th:action="${product != null ? '/vendor/products/edit/' + product.id : '/vendor/products/create'}"
                      th:object="${productFormReq}" method="post" class="product-form"
                      enctype="multipart/form-data">
                    
                    <div class="form-group">
                        <label for="name">Tên sản phẩm *</label>
                        <input type="text" id="name" th:field="*{name}" required minlength="1" maxlength="200" 
                               placeholder="Nhập tên sản phẩm">
                        <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Mô tả sản phẩm</label>
                        <textarea id="description" th:field="*{description}" rows="5" 
                                  placeholder="Mô tả chi tiết về sản phẩm..."></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Giá (VNĐ) *</label>
                            <input type="number" id="price" th:field="*{price}" required
                                   placeholder="0">
                            <div th:if="${#fields.hasErrors('price')}" class="error" th:errors="*{price}"></div>
                        </div>
                        <div class="form-group">
                            <label for="stock">Số lượng tồn kho *</label>
                            <input type="number" id="stock" th:field="*{stock}" required
                                   placeholder="0">
                            <div th:if="${#fields.hasErrors('stock')}" class="error" th:errors="*{stock}"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="categoryId">Danh mục</label>
                        <select id="categoryId" th:field="*{categoryId}">
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.id}" 
                                    th:text="${cat.name}">Danh mục</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="imageFile">Hình ảnh sản phẩm</label>
                        <input type="file" id="imageFile" name="imageFile"
                               accept="image/png,image/jpeg,image/jpg,image/webp,image/gif">
                        <small class="form-hint">Chấp nhận JPG, PNG, WEBP, GIF. Tối đa 5MB.</small>
                        <img id="imagePreview" style="display:none;margin-top:10px;max-width:240px;border-radius:6px;">
                        <div th:if="${product != null and product.imageUrls != null and !product.imageUrls.isEmpty()}" class="current-images">
                            <p style="margin-top:10px;font-size:13px;color:#555;">Ảnh hiện tại:</p>
                            <img th:src="${product.imageUrls[0]}" style="max-width:240px;border-radius:6px;">
                        </div>
                    </div>
                    
                    <div class="form-group" th:if="${product != null}">
                        <label for="status">Trạng thái</label>
                        <select id="status" th:field="*{status}">
                            <option value="ACTIVE">Đang bán</option>
                            <option value="DRAFT">Bản nháp</option>
                            <option value="INACTIVE">Ngừng bán</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <a th:href="@{/vendor/products}" class="btn btn-secondary">Hủy</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                    </div>
                </form>
                <script>
                    document.getElementById('imageFile').addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (!file) return;
                        const preview = document.getElementById('imagePreview');
                        preview.src = URL.createObjectURL(file);
                        preview.style.display = 'block';
                    });
                </script>
            </main>
        </div>
    </div>
</body>
</html>
