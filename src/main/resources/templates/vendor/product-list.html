<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - CNJ70 Vendor</title>
    <link rel="stylesheet" th:href="@{/css/admin-vendor.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div th:replace="fragments/dashboard-sidebar"></div>
        <div class="main-content">
            <div th:replace="fragments/dashboard-topbar"></div>
            <main class="dashboard-content">
                <div class="content-header">
                    <h1>Quản lý sản phẩm</h1>
                    <a th:href="@{/vendor/products/create}" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Thêm sản phẩm
                    </a>
                </div>
                
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá</th>
                            <th>Tồn kho</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td><img th:src="${product.thumbnailUrl}" alt="" width="50"></td>
                            <td th:text="${product.name}">Tên sản phẩm</td>
                            <td th:text="${#numbers.formatCurrency(product.price)}">0đ</td>
                            <td th:text="${product.stock}">0</td>
                            <td><span class="status-badge" th:text="${product.status}">ACTIVE</span></td>
                            <td>
                                <a th:href="@{/vendor/products/edit/{id}(id=${product.id})}" class="btn-sm">Sửa</a>
                                <form th:action="@{/vendor/products/delete/{id}(id=${product.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn-sm btn-danger" onclick="return confirm('Bạn có chắc?')">Xóa</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </main>
        </div>
    </div>
</body>
</html>
