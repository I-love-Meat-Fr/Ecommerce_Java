<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - CNJ70 Vendor</title>
    <link rel="stylesheet" th:href="@{/css/admin-vendor.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div th:replace="~{fragments/dashboard-sidebar}"></div>
        <div class="main-content">
            <div th:replace="~{fragments/dashboard-topbar}"></div>
            <main class="dashboard-content">
                <div class="content-header">
                    <h1>Quản lý sản phẩm</h1>
                    <a th:href="@{/vendor/products/create}" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Thêm sản phẩm
                    </a>
                </div>
                
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                
                <div th:if="${#lists.isEmpty(products)}" class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h3>Chưa có sản phẩm nào</h3>
                    <p>Bắt đầu bán hàng bằng cách thêm sản phẩm đầu tiên của bạn.</p>
                    <a th:href="@{/vendor/products/create}" class="btn btn-primary">Thêm sản phẩm</a>
                </div>
                
                <table th:unless="${#lists.isEmpty(products)}" class="data-table">
                    <thead>
                        <tr>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th>Tồn kho</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td>
                                <img th:if="${product.thumbnailUrl}" th:src="${product.thumbnailUrl}" alt="" width="50" height="50" style="object-fit: cover;">
                                <i th:unless="${product.thumbnailUrl}" class="fas fa-image" style="font-size: 24px; color: #ccc;"></i>
                            </td>
                            <td>
                                <strong th:text="${product.name}">Tên sản phẩm</strong>
                            </td>
                            <td th:text="${product.categoryName != null ? product.categoryName : 'Chưa phân loại'}">Danh mục</td>
                            <td th:text="${@money.format(product.price)}">0đ</td>
                            <td>
                                <span th:class="${product.stock <= 0 ? 'text-danger' : (product.stock <= 10 ? 'text-warning' : '')}" 
                                      th:text="${product.stock}">0</span>
                            </td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${product.status.name() == 'ACTIVE' ? 'status-active' : (product.status.name() == 'DRAFT' ? 'status-draft' : 'status-inactive')}"
                                      th:text="${product.status.name()}">ACTIVE</span>
                            </td>
                            <td class="actions">
                                <a th:href="@{/vendor/products/edit/{id}(id=${product.id})}" class="btn-sm btn-primary" title="Sửa">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/vendor/products/delete/{id}(id=${product.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn-sm btn-danger" onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')" title="Xóa">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </main>
        </div>
    </div>
</body>
</html>
