<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/vendor-layout :: layout(title='Chờ duyệt cửa hàng - CNJ70 Vendor', content=~{::main-content}, scripts=~{::page-scripts})}">
<head>
    <title>Chờ duyệt cửa hàng - CNJ70 Vendor</title>
</head>
<body>
<main th:fragment="main-content">

    <div class="vd-page-hero">
        <div class="vd-page-hero-left">
            <div class="vd-page-hero-icon" style="background:linear-gradient(135deg,#f59e0b,#d97706);"><i class="fas fa-hourglass-half"></i></div>
            <div class="vd-page-hero-info">
                <h2>Cửa hàng của bạn</h2>
                <p>Quản lý thông tin và trạng thái cửa hàng.</p>
            </div>
        </div>
    </div>

    <div class="sd-card vd-pending-card">
        <div class="sd-card-body">
            <div class="vd-pending-icon">
                <i class="fas fa-hourglass-half"></i>
            </div>
            <h2>Chờ quản trị viên duyệt</h2>
            <p>Cửa hàng của bạn đang chờ được duyệt bởi quản trị viên.<br>
            Bạn sẽ có thể quản lý sản phẩm và đơn hàng sau khi cửa hàng được duyệt.</p>

            <div class="vd-pending-info">
                <div class="vd-pending-row">
                    <i class="fas fa-store"></i>
                    <div>
                        <div class="vd-pending-label">Tên cửa hàng</div>
                        <div class="vd-pending-value" th:text="${shop.shopName}">Shop name</div>
                    </div>
                </div>
                <div class="vd-pending-row">
                    <i class="fas fa-circle-check"></i>
                    <div>
                        <div class="vd-pending-label">Trạng thái</div>
                        <div class="vd-pending-value" style="color:#d97706;">
                            <i class="fas fa-hourglass-half"></i> CHỜ DUYỆT
                        </div>
                    </div>
                </div>
                <div class="vd-pending-row">
                    <i class="fas fa-clock" style="color:var(--muted);"></i>
                    <div>
                        <div class="vd-pending-label">Ngày tạo</div>
                        <div class="vd-pending-value"
                             th:text="${shop.createdAt != null} ? ${#temporals.format(shop.createdAt, 'dd/MM/yyyy HH:mm')} : '—'">—</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<th:block th:fragment="page-scripts"></th:block>
</body>
</html>
