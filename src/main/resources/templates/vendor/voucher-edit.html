<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Voucher - CNJ70 Vendor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/vendor-shared.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sd-app" id="appShell">
        <aside class="sd-sidebar">
            <div class="sd-sidebar-header">
                <div class="sd-sidebar-logo"><i class="fas fa-bolt"></i></div>
                <div class="sd-sidebar-brand">
                    <span class="sd-sidebar-brand-name">CNJ70 Shop</span>
                    <span class="sd-sidebar-brand-sub">Vendor Console</span>
                </div>
            </div>
            <nav class="sd-sidebar-nav">
                <div class="sd-sidebar-nav-section">
                    <span class="sd-sidebar-nav-title">Tổng quan</span>
                    <a th:href="@{/vendor/dashboard}" class="sd-nav-item"><i class="fas fa-house"></i><span class="sd-nav-label">Dashboard</span></a>
                </div>
                <div class="sd-sidebar-nav-section">
                    <span class="sd-sidebar-nav-title">Quản lý</span>
                    <a th:href="@{/vendor/shop}" class="sd-nav-item"><i class="fas fa-store"></i><span class="sd-nav-label">Cửa hàng</span></a>
                    <a th:href="@{/vendor/products}" class="sd-nav-item"><i class="fas fa-box"></i><span class="sd-nav-label">Sản phẩm</span></a>
                    <a th:href="@{/vendor/orders}" class="sd-nav-item"><i class="fas fa-cart-shopping"></i><span class="sd-nav-label">Đơn hàng</span></a>
                    <a th:href="@{/vendor/vouchers}" class="sd-nav-item active"><i class="fas fa-ticket"></i><span class="sd-nav-label">Voucher</span></a>
                </div>
                <div class="sd-sidebar-nav-section">
                    <span class="sd-sidebar-nav-title">Khác</span>
                    <a th:href="@{/home}" class="sd-nav-item"><i class="fas fa-globe"></i><span class="sd-nav-label">Xem website</span></a>
                    <form th:action="@{/auth/logout}" method="post" class="sd-logout-form">
                        <button type="submit" class="sd-nav-item"><i class="fas fa-arrow-right-from-bracket"></i><span class="sd-nav-label">Đăng xuất</span></button>
                    </form>
                </div>
            </nav>
            <div class="sd-sidebar-footer">
                <div class="sd-sidebar-user">
                    <div class="sd-sidebar-avatar" sec:authentication="name">V</div>
                    <div class="sd-sidebar-user-info">
                        <div class="sd-sidebar-user-name" sec:authentication="name">Vendor</div>
                        <div class="sd-sidebar-user-role">Vendor</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="sd-main">
            <div class="sd-topbar">
                <button class="sd-topbar-toggle" type="button" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <div class="sd-topbar-actions">
                    <a th:href="@{/vendor/vouchers}" class="sd-btn sd-btn-secondary sd-btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
                </div>
            </div>

            <main class="sd-content">

                <div class="vd-page-hero">
                    <div class="vd-page-hero-left">
                        <div class="vd-page-hero-icon"><i class="fas fa-pen-to-square"></i></div>
                        <div class="vd-page-hero-info">
                            <h2>Sửa Voucher</h2>
                            <p>Cập nhật thông tin voucher <strong th:text="${voucher.code}" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">CODE</strong></p>
                        </div>
                    </div>
                </div>

                <div th:if="${error}" class="sd-alert sd-alert-danger"><i class="fas fa-triangle-exclamation"></i><span th:text="${error}"></span></div>

                <div class="sd-card" style="max-width:960px;">
                    <div class="sd-card-body">
                        <form th:action="@{/vendor/vouchers/edit/{id}(id=${voucher.id})}" th:object="${voucherForm}" method="post">
                            <div class="vd-form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                                <div class="sd-form-group" style="grid-column:1/-1;">
                                    <label>Mã voucher</label>
                                    <input type="text" th:value="${voucher.code}" class="sd-form-control" disabled style="background:var(--bg-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;font-weight:700;">
                                    <div class="sd-form-hint">Mã voucher không thể thay đổi sau khi tạo</div>
                                </div>

                                <div class="sd-form-group" style="grid-column:1/-1;">
                                    <label>Tên voucher</label>
                                    <input type="text" th:field="*{name}" class="sd-form-control" placeholder="VD: Summer Sale - Giảm 10%">
                                </div>

                                <div class="sd-form-group">
                                    <label>Giá trị giảm</label>
                                    <input type="number" th:field="*{discountValue}" class="sd-form-control" min="1" step="1">
                                </div>

                                <div class="sd-form-group">
                                    <label>Giảm tối đa (VNĐ)</label>
                                    <input type="number" th:field="*{maxDiscountAmount}" class="sd-form-control" min="0" step="1000">
                                </div>

                                <div class="sd-form-group">
                                    <label>Giá trị đơn hàng tối thiểu (VNĐ)</label>
                                    <input type="number" th:field="*{minOrderValue}" class="sd-form-control" min="0" step="1000">
                                </div>

                                <div class="sd-form-group">
                                    <label>Số lượng voucher</label>
                                    <input type="number" th:field="*{quantity}" class="sd-form-control" min="1" step="1">
                                    <div class="sd-form-hint">Đã sử dụng: <strong th:text="${voucher.used}">0</strong> lượt</div>
                                </div>

                                <div class="sd-form-group" style="grid-column:1/-1;">
                                    <label>Thời gian hiệu lực</label>
                                    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                                        <div style="flex:1;min-width:200px;">
                                            <input type="datetime-local" th:field="*{startDate}" class="sd-form-control"
                                                   th:value="${voucher.startDate != null} ? ${#temporals.format(voucher.startDate, 'yyyy-MM-dd''T''HH:mm')} : ''">
                                        </div>
                                        <span style="color:var(--muted);">—</span>
                                        <div style="flex:1;min-width:200px;">
                                            <input type="datetime-local" th:field="*{endDate}" class="sd-form-control"
                                                   th:value="${voucher.endDate != null} ? ${#temporals.format(voucher.endDate, 'yyyy-MM-dd''T''HH:mm')} : ''">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div style="display:flex;gap:12px;justify-content:flex-end;padding-top:24px;border-top:1px solid var(--line);margin-top:24px;">
                                <a th:href="@{/vendor/vouchers}" class="sd-btn sd-btn-secondary">Hủy</a>
                                <button type="submit" class="sd-btn sd-btn-cta"><i class="fas fa-check"></i> Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        (function() {
            const shell = document.getElementById('appShell');
            const toggle = document.getElementById('sidebarToggle');
            const KEY = 'cnj70-sidebar-expanded';
            if (localStorage.getItem(KEY) === '1') shell.classList.add('sidebar-expanded');
            toggle?.addEventListener('click', () => {
                shell.classList.toggle('sidebar-expanded');
                localStorage.setItem(KEY, shell.classList.contains('sidebar-expanded') ? '1' : '0');
            });
            document.querySelectorAll('.sd-sidebar-avatar, .sd-topbar-avatar').forEach(el => {
                const name = (el.textContent || '').trim();
                if (!name) return;
                el.textContent = name.charAt(0).toUpperCase();
            });
        })();
    </script>
</body>
</html>
