<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Voucher - CNJ70 Vendor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full-width { grid-column: span 2; }
        .form-label { display: block; font-weight: 500; color: var(--text); font-size: 14px; margin-bottom: 8px; }
        .form-label span.required { color: #ee4d2d; }
        .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: #fff; box-sizing: border-box; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #ee4d2d; }
        .form-error { color: var(--danger); font-size: 12px; margin-top: 4px; }
        .form-hint { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
        .form-actions { display: flex; gap: 12px; justify-content: flex-end; padding-top: 20px; border-top: 1px solid var(--border); margin-top: 20px; }
        .preview-card { background: linear-gradient(135deg, #ee4d2d, #ff7337); border-radius: var(--radius); padding: 20px; color: #fff; }
        .preview-card .preview-code { font-family: monospace; font-size: 20px; font-weight: 700; letter-spacing: 2px; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; display: inline-block; margin-bottom: 12px; }
        .preview-card .preview-discount { font-size: 32px; font-weight: 700; }
        .preview-card .preview-info { font-size: 13px; opacity: 0.9; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="sd-app" id="appShell">
        <aside class="sd-sidebar">
            <div class="sd-sidebar-header">
                <div class="sd-sidebar-logo"><i class="fas fa-bolt"></i></div>
                <div class="sd-sidebar-brand">
                    <span class="sd-sidebar-brand-name">CNJ70 Shop</span>
                    <span class="sd-sidebar-brand-sub">Vendor Console</span>
                </div>
            </div>
            <nav class="sd-sidebar-nav">
                <div class="sd-sidebar-nav-section">
                    <span class="sd-sidebar-nav-title">Tổng quan</span>
                    <a th:href="@{/vendor/dashboard}" class="sd-nav-item"><i class="fas fa-house"></i><span class="sd-nav-label">Dashboard</span></a>
                </div>
                <div class="sd-sidebar-nav-section">
                    <span class="sd-sidebar-nav-title">Quản lý</span>
                    <a th:href="@{/vendor/shop}" class="sd-nav-item"><i class="fas fa-store"></i><span class="sd-nav-label">Cửa hàng</span></a>
                    <a th:href="@{/vendor/products}" class="sd-nav-item"><i class="fas fa-box"></i><span class="sd-nav-label">Sản phẩm</span></a>
                    <a th:href="@{/vendor/orders}" class="sd-nav-item"><i class="fas fa-cart-shopping"></i><span class="sd-nav-label">Đơn hàng</span></a>
                    <a th:href="@{/vendor/vouchers}" class="sd-nav-item active"><i class="fas fa-ticket"></i><span class="sd-nav-label">Voucher</span></a>
                </div>
                <div class="sd-sidebar-nav-section">
                    <span class="sd-sidebar-nav-title">Khác</span>
                    <a th:href="@{/home}" class="sd-nav-item"><i class="fas fa-globe"></i><span class="sd-nav-label">Xem website</span></a>
                    <form th:action="@{/auth/logout}" method="post" style="margin:0;">
                        <button type="submit" class="sd-nav-item"><i class="fas fa-arrow-right-from-bracket"></i><span class="sd-nav-label">Đăng xuất</span></button>
                    </form>
                </div>
            </nav>
            <div class="sd-sidebar-footer">
                <div class="sd-sidebar-user">
                    <div class="sd-sidebar-avatar" sec:authentication="name">V</div>
                    <div class="sd-sidebar-user-info">
                        <div class="sd-sidebar-user-name" sec:authentication="name">Vendor</div>
                        <div class="sd-sidebar-user-role">Vendor</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="sd-main">
            <div class="sd-topbar">
                <button class="sd-topbar-toggle" type="button" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <div class="sd-topbar-actions">
                    <a th:href="@{/vendor/vouchers}" class="sd-btn sd-btn-secondary sd-btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
                </div>
            </div>

            <main class="sd-content">
                <div class="sd-page-head">
                    <div class="sd-page-head-title">
                        <h1>Sửa Voucher</h1>
                        <p>Cập nhật thông tin voucher</p>
                    </div>
                </div>

                <div th:if="${error}" class="sd-alert" style="background:var(--danger-soft);color:var(--danger);padding:12px 16px;border-radius:var(--radius);margin-bottom:20px;">
                    <i class="fas fa-exclamation-triangle"></i><span th:text="${error}"></span>
                </div>

                <div class="sd-card">
                    <div class="sd-card-body">
                        <form th:action="@{/vendor/vouchers/edit/{id}(id=${voucher.id})}" th:object="${voucherForm}" method="post">
                            <div class="form-grid">
                                <!-- Mã voucher (disabled) -->
                                <div class="form-group full-width">
                                    <label class="form-label">Mã voucher</label>
                                    <input type="text" th:value="${voucher.code}" class="form-input" disabled style="background:#f5f5f5;">
                                    <div class="form-hint">Mã voucher không thể thay đổi sau khi tạo</div>
                                </div>

                                <!-- Tên voucher -->
                                <div class="form-group full-width">
                                    <label class="form-label">Tên voucher</label>
                                    <input type="text" th:field="*{name}" class="form-input" placeholder="VD: Summer Sale - Giảm 10%">
                                </div>

                                <!-- Giá trị giảm -->
                                <div class="form-group">
                                    <label class="form-label">Giá trị giảm</label>
                                    <input type="number" th:field="*{discountValue}" class="form-input" min="1" step="1">
                                </div>

                                <!-- Giảm tối đa -->
                                <div class="form-group">
                                    <label class="form-label">Giảm tối đa (VNĐ)</label>
                                    <input type="number" th:field="*{maxDiscountAmount}" class="form-input" min="0" step="1000">
                                </div>

                                <!-- Đơn hàng tối thiểu -->
                                <div class="form-group">
                                    <label class="form-label">Giá trị đơn hàng tối thiểu (VNĐ)</label>
                                    <input type="number" th:field="*{minOrderValue}" class="form-input" min="0" step="1000">
                                </div>

                                <!-- Số lượng -->
                                <div class="form-group">
                                    <label class="form-label">Số lượng voucher</label>
                                    <input type="number" th:field="*{quantity}" class="form-input" min="1" step="1">
                                    <div class="form-hint">Đã sử dụng: <strong th:text="${voucher.used}">0</strong> lượt</div>
                                </div>

                                <!-- Thời gian -->
                                <div class="form-group full-width">
                                    <label class="form-label">Thời gian hiệu lực</label>
                                    <div style="display: flex; gap: 12px; align-items: center;">
                                        <div class="form-group" style="flex:1;margin-bottom:0;">
                                            <input type="datetime-local" th:field="*{startDate}" class="form-input" th:value="${voucher.startDate != null ? #temporals.format(voucher.startDate, 'yyyy-MM-dd''T''HH:mm') : ''}">
                                        </div>
                                        <span style="color:var(--text-muted);">—</span>
                                        <div class="form-group" style="flex:1;margin-bottom:0;">
                                            <input type="datetime-local" th:field="*{endDate}" class="form-input" th:value="${voucher.endDate != null ? #temporals.format(voucher.endDate, 'yyyy-MM-dd''T''HH:mm') : ''}">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-actions">
                                <a th:href="@{/vendor/vouchers}" class="sd-btn sd-btn-secondary">Hủy</a>
                                <button type="submit" class="sd-btn sd-btn-primary"><i class="fas fa-check"></i> Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        (function() {
            const shell = document.getElementById('appShell');
            const toggle = document.getElementById('sidebarToggle');
            const KEY = 'cnj70-sidebar-expanded';
            if (localStorage.getItem(KEY) === '1') shell.classList.add('sidebar-expanded');
            toggle?.addEventListener('click', () => {
                shell.classList.toggle('sidebar-expanded');
                localStorage.setItem(KEY, shell.classList.contains('sidebar-expanded') ? '1' : '0');
            });
        })();
    </script>
</body>
</html>
