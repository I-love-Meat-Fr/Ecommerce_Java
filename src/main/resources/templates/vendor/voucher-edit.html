<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/vendor-layout :: layout(title='Sửa Voucher - CNJ70 Vendor', content=~{::main-content}, scripts=~{::page-scripts})}">
<head>
    <title>Sửa Voucher - CNJ70 Vendor</title>
</head>
<body>
<main th:fragment="main-content">

    <div class="vd-page-hero">
        <div class="vd-page-hero-left">
            <div class="vd-page-hero-icon"><i class="fas fa-pen-to-square"></i></div>
            <div class="vd-page-hero-info">
                <h2>Sửa Voucher</h2>
                <p>Cập nhật thông tin voucher <strong th:text="${voucher.code}" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">CODE</strong></p>
            </div>
        </div>
    </div>

    <div th:if="${error}" class="sd-alert sd-alert-danger"><i class="fas fa-triangle-exclamation"></i><span th:text="${error}"></span></div>

    <div class="sd-card" style="max-width:960px;">
        <div class="sd-card-body">
            <form th:action="@{/vendor/vouchers/edit/{id}(id=${voucher.id})}" th:object="${voucherForm}" method="post">
                <div class="vd-form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                    <div class="sd-form-group" style="grid-column:1/-1;">
                        <label>Mã voucher</label>
                        <input type="text" th:value="${voucher.code}" class="sd-form-control" disabled style="background:var(--bg-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;font-weight:700;">
                        <div class="sd-form-hint">Mã voucher không thể thay đổi sau khi tạo</div>
                    </div>

                    <div class="sd-form-group" style="grid-column:1/-1;">
                        <label>Tên voucher</label>
                        <input type="text" th:field="*{name}" class="sd-form-control" placeholder="VD: Summer Sale - Giảm 10%">
                    </div>

                    <div class="sd-form-group">
                        <label>Giá trị giảm</label>
                        <input type="number" th:field="*{discountValue}" class="sd-form-control" min="1" step="1">
                    </div>

                    <div class="sd-form-group">
                        <label>Giảm tối đa (VNĐ)</label>
                        <input type="number" th:field="*{maxDiscountAmount}" class="sd-form-control" min="0" step="1000">
                    </div>

                    <div class="sd-form-group">
                        <label>Giá trị đơn hàng tối thiểu (VNĐ)</label>
                        <input type="number" th:field="*{minOrderValue}" class="sd-form-control" min="0" step="1000">
                    </div>

                    <div class="sd-form-group">
                        <label>Số lượng voucher</label>
                        <input type="number" th:field="*{quantity}" class="sd-form-control" min="1" step="1">
                        <div class="sd-form-hint">Đã sử dụng: <strong th:text="${voucher.used}">0</strong> lượt</div>
                    </div>

                    <div class="sd-form-group" style="grid-column:1/-1;">
                        <label>Thời gian hiệu lực</label>
                        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                            <div style="flex:1;min-width:200px;">
                                <input type="datetime-local" th:field="*{startDate}" class="sd-form-control"
                                       th:value="${voucher.startDate != null} ? ${#temporals.format(voucher.startDate, 'yyyy-MM-dd''T''HH:mm')} : ''">
                            </div>
                            <span style="color:var(--muted);">—</span>
                            <div style="flex:1;min-width:200px;">
                                <input type="datetime-local" th:field="*{endDate}" class="sd-form-control"
                                       th:value="${voucher.endDate != null} ? ${#temporals.format(voucher.endDate, 'yyyy-MM-dd''T''HH:mm')} : ''">
                            </div>
                        </div>
                    </div>
                </div>

                <div style="display:flex;gap:12px;justify-content:flex-end;padding-top:24px;border-top:1px solid var(--line);margin-top:24px;">
                    <a th:href="@{/vendor/vouchers}" class="sd-btn sd-btn-secondary">Hủy</a>
                    <button type="submit" class="sd-btn sd-btn-cta"><i class="fas fa-check"></i> Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

</main>

<th:block th:fragment="page-scripts"></th:block>
</body>
</html>
