<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:replace="~{layout/moderator-layout :: layout(title='Review Detail - Moderator', content=~{::main-content}, scripts=~{::page-scripts})}">
<head>
    <title>Review Detail - Moderator CNJ70</title>
</head>
<body>
<main th:fragment="main-content">
    <!-- Breadcrumb -->
    <div style="margin-bottom:16px;">
        <a th:href="@{/moderator/reviews(page=${page}, size=${size}, status=${status}, q=${q})}"
           class="sd-btn sd-btn-secondary sd-btn-sm">
            <i class="fas fa-arrow-left"></i> Quay lại Queue
        </a>
    </div>

    <div style="display:grid;grid-template-columns:1fr 360px;gap:24px;" class="review-detail-grid">
        <!-- Main Content -->
        <div>
            <!-- Review Info Card -->
            <div class="sd-card">
                <div class="sd-card-header">
                    <h2 class="sd-card-title">
                        <i class="fas fa-comment-dots"></i>
                        Chi tiết Review
                    </h2>
                    <span th:if="${review.moderationStatus.name() == 'REPORTED'}" class="sd-badge sd-badge-danger">
                        <i class="fas fa-flag"></i> Reported
                    </span>
                    <span th:if="${review.moderationStatus.name() == 'HIDDEN'}" class="sd-badge sd-badge-slate">
                        <i class="fas fa-eye-slash"></i> Hidden
                    </span>
                    <span th:if="${review.moderationStatus.name() == 'VISIBLE'}" class="sd-badge sd-badge-success">
                        <i class="fas fa-eye"></i> Visible
                    </span>
                </div>
                <div class="sd-card-body">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
                        <div>
                            <label class="sd-form-label">Review ID</label>
                            <code style="font-size:12px;" th:text="${review.id}">id</code>
                        </div>
                        <div>
                            <label class="sd-form-label">Ngày tạo</label>
                            <span th:if="${review.createdAt != null}"
                                  th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm:ss')}">—</span>
                            <span th:unless="${review.createdAt != null}">—</span>
                        </div>
                        <div>
                            <label class="sd-form-label">User ID</label>
                            <span th:text="${review.userId}">userId</span>
                        </div>
                        <div>
                            <label class="sd-form-label">Customer</label>
                            <span th:text="${review.userName != null ? review.userName : 'Ẩn danh'}">User</span>
                        </div>
                        <div>
                            <label class="sd-form-label">Product ID</label>
                            <span th:text="${review.productId}">productId</span>
                        </div>
                        <div>
                            <label class="sd-form-label">Rating</label>
                            <span class="sd-badge sd-badge-warning" style="font-size:16px;">
                                <span th:text="${review.rating}">5</span> <i class="fas fa-star"></i>
                            </span>
                        </div>
                    </div>

                    <div style="margin-bottom:24px;">
                        <label class="sd-form-label">Nội dung đánh giá</label>
                        <div style="background:#f8fafc;padding:16px;border-radius:8px;border:1px solid var(--border,#e2e8f0);">
                            <p th:text="${review.comment}" style="margin:0;white-space:pre-wrap;">Comment</p>
                        </div>
                    </div>

                    <!-- Moderation info -->
                    <div th:if="${review.moderatedBy != null}" style="background:#fff7ed;padding:16px;border-radius:8px;border:1px solid #fed7aa;margin-bottom:24px;">
                        <label class="sd-form-label" style="color:#c2410c;">Đã được kiểm duyệt</label>
                        <div>
                            <strong>Moderated by:</strong> <span th:text="${review.moderatedBy}">modId</span>
                        </div>
                        <div th:if="${review.moderationReason != null}">
                            <strong>Lý do:</strong> <span th:text="${review.moderationReason}">reason</span>
                        </div>
                        <div th:if="${review.moderatedAt != null}">
                            <strong>Thời gian:</strong> <span th:text="${#temporals.format(review.moderatedAt, 'dd/MM/yyyy HH:mm')}">—</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <form th:if="${review.moderationStatus.name() == 'REPORTED'}"
                              th:action="@{/moderator/reviews/{id}/hide(id=${review.id}, page=${page}, size=${size}, status=${status}, q=${q})}"
                              method="post">
                            <div style="display:flex;gap:8px;align-items:start;">
                                <input type="text" name="reason" placeholder="Lý do ẩn review..."
                                       class="sd-input" style="flex:1;min-width:200px;" required />
                                <button type="submit" class="sd-btn sd-btn-warning"
                                        onclick="return confirm('Ẩn review này?');">
                                    <i class="fas fa-eye-slash"></i> Ẩn Review
                                </button>
                            </div>
                        </form>

                        <form th:if="${review.moderationStatus.name() == 'HIDDEN'}"
                              th:action="@{/moderator/reviews/{id}/restore(id=${review.id}, page=${page}, size=${size}, status=${status}, q=${q})}"
                              method="post">
                            <button type="submit" class="sd-btn sd-btn-success"
                                    onclick="return confirm('Khôi phục review này?');">
                                <i class="fas fa-eye"></i> Khôi phục Review
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div>
            <!-- Product Info -->
            <div class="sd-card" th:if="${product != null}">
                <div class="sd-card-header">
                    <h3 class="sd-card-title">
                        <i class="fas fa-box"></i>
                        Sản phẩm
                    </h3>
                </div>
                <div class="sd-card-body">
                    <div style="margin-bottom:12px;">
                        <label class="sd-form-label">Tên sản phẩm</label>
                        <div th:text="${product.name}">Product name</div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label class="sd-form-label">Giá</label>
                        <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">0</span> đ
                    </div>
                    <a th:href="@{/products/{id}(id=${product.id})}"
                       class="sd-btn sd-btn-secondary sd-btn-sm" target="_blank">
                        <i class="fas fa-external-link-alt"></i> Xem sản phẩm
                    </a>
                </div>
            </div>

            <!-- Report Info -->
            <div class="sd-card" th:if="${review.reportCount != null && review.reportCount > 0}">
                <div class="sd-card-header">
                    <h3 class="sd-card-title">
                        <i class="fas fa-flag" style="color:#ef4444;"></i>
                        Báo cáo vi phạm
                    </h3>
                </div>
                <div class="sd-card-body">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                        <div style="font-size:32px;font-weight:700;color:#ef4444;" th:text="${review.reportCount}">0</div>
                        <div style="font-size:13px;color:#64748b;">lượt report</div>
                    </div>
                    <div th:if="${review.reportReasons != null}">
                        <label class="sd-form-label">Lý do report:</label>
                        <ul style="margin:0;padding-left:20px;">
                            <li th:each="reason : ${review.reportReasons}" th:text="${reason}">reason</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @media (max-width: 900px) {
            .review-detail-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</main>

<th:block th:fragment="page-scripts"></th:block>
</body>
</html>
