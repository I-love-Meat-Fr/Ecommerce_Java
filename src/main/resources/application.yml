spring:
  application:
    name: CNJ70 Ecommerce
  
  # MongoDB Configuration - Load from environment or .env file
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://nguyenquocanh170205_db_user:FJGAwn7TMMPkcslN@cluster0.2pu37z6.mongodb.net}
      database: ${MONGODB_DATABASE:cnj70_ecommerce}
      # PERFORMANCE #8 — tắt auto index creation ở prod để tránh app start
      # bị blocking khi MongoDB tạo index. Index migration nên chạy qua
      # script riêng (init-mongo.js) hoặc Mongo CLI.
      auto-index-creation: false
  
  # Thymeleaf Configuration
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    # PERFORMANCE #4 — bật template cache để không phải re-parse HTML mỗi
    # request. Trong profile dev có thể đặt lại false qua SPRING_PROFILES_ACTIVE=dev.
    cache: true

  # Multipart upload
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
  
  # Jackson Configuration
  jackson:
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

# PERFORMANCE #4 — bật HTTP compression cho response body > 1KB.
# Tiết kiệm ~70% băng thông cho HTML, CSS, JS, JSON.
server:
  port: 8081
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,text/xml,application/javascript,application/json,image/svg+xml,application/xml
    min-response-size: 1024

# Static resource handling
# PERFORMANCE #4 — bỏ `no-store: true` để browser có thể cache static assets
# giữa các request. CSS/JS đã có content-hash hoặc version query sẽ tự invalidate.
# max-age=3600 (1 giờ): đủ cho user session trung bình.
spring.web.resources:
  add-mappings: true
  cache:
    cachecontrol:
      max-age: 3600
      cache-public: true
  static-locations: classpath:/static/

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong}
  expiration: 86400000  # 24 hours in milliseconds

# PII Encryption Key (AES-256-GCM, must be 32-byte Base64)
# Generate with: openssl rand -base64 32
# DEV DEFAULT — override in production via OS env var or .env file.
# Required for CryptoUtil bean (encrypts CCCD, taxCode, bankAccount...).
# Note: aliased via app.encryption.dev-key to avoid a self-referential placeholder.
ENCRYPTION_KEY: ${app.encryption.dev-key:XoAzcRRdRaOgufwPTZTocPy5RVJkWauddL25AEgkcKg=}
app:
  encryption:
    dev-key: XoAzcRRdRaOgufwPTZTocPy5RVJkWauddL25AEgkcKg=  # dev-only fallback; do not use in prod

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.cnj70: INFO
    # PERFORMANCE #8 — đổi Security + MongoDB log về WARN/INFO ở prod.
    # Debug log tốn I/O, làm tăng latency ~5-10%.
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN

# KYC 3rd-party Provider Configuration
kyc:
  provider:
    url: ${KYC_PROVIDER_URL:https://kyc-provider.example.com/api/verify}
    api-key: ${KYC_PROVIDER_API_KEY:}
    timeout-connect: 10      # seconds
    timeout-read: 30         # seconds
  fallback:
    # PENDING_THIRD_PARTY: giữ nguyên chờ 3rd-party (an toàn, admin duyệt tay nếu fail)
    # APPROVE: tự động coi như 3rd-party OK → chờ admin duyệt (dev/demo)
    on-error: APPROVE

# Premium Subscription Scheduler — quét VendorSubscription đã quá hạn
premium:
  scheduler:
    # Mặc định: 1h sáng mỗi ngày. Format Spring cron (6 fields, second đầu tiên).
    cron: "0 0 1 * * *"

