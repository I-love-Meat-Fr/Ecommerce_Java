spring:
  application:
    name: CNJ70 Ecommerce
  
  # MongoDB Configuration - Load from environment or .env file
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://nguyenquocanh170205_db_user:FJGAwn7TMMPkcslN@cluster0.2pu37z6.mongodb.net}
      database: ${MONGODB_DATABASE:cnj70_ecommerce}
      auto-index-creation: true
  
  # Thymeleaf Configuration
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  # Multipart upload
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
  
  # Jackson Configuration
  jackson:
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

# Static resource handling - graceful 404 instead of 500 for missing files
spring.web.resources:
  add-mappings: true
  cache:
    cachecontrol:
      # Tắt cache để F5/CSS reload tức thì khi dev; prod nên đặt lại 3600
      max-age: 0
      no-store: true
  static-locations: classpath:/static/

# Server Configuration
server:
  port: 8081
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong}
  expiration: 86400000  # 24 hours in milliseconds

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.cnj70: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG

# KYC 3rd-party Provider Configuration
kyc:
  provider:
    url: ${KYC_PROVIDER_URL:https://kyc-provider.example.com/api/verify}
    api-key: ${KYC_PROVIDER_API_KEY:}
    timeout-connect: 10      # seconds
    timeout-read: 30         # seconds
  fallback:
    # PENDING_THIRD_PARTY: giữ nguyên chờ 3rd-party (an toàn, admin duyệt tay nếu fail)
    # APPROVE: tự động coi như 3rd-party OK → chờ admin duyệt (dev/demo)
    on-error: APPROVE

# Product Auto Moderation Pipeline (PHASE B-I)
# Mặc định trống = không có keyword/category cấm nào. Thay đổi qua
# environment-specific profile (application-staging.yml, application-prod.yml).
moderation:
  auto:
    # BlacklistKeywordCheck (C2 / task #3.0)
    blacklist-keywords: ${MODERATION_BLACKLIST_KEYWORDS:}
    # ForbiddenCategoryPolicy (C6 / task #7.0) — list categoryId bị cấm
    forbidden-category-ids: ${MODERATION_FORBIDDEN_CATEGORY_IDS:}
    # ImageHashCheck (C5 / task #6.0) — whitelist image extensions
    allowed-image-extensions: jpg,jpeg,png,webp
    # PriceAnomalyCheck (C4 / task #5.0) — median + MAD anomaly detection
    price-history-window-days: 30
    price-anomaly-z-threshold: 3.0
    price-anomaly-min-samples: 5
    price-anomaly-mad-epsilon: 1.0
