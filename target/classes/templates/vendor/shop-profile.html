<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cửa hàng - CNJ70 Vendor</title>
    <link rel="stylesheet" th:href="@{/css/admin-vendor.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div th:replace="fragments/dashboard-sidebar"></div>
        <div class="main-content">
            <div th:replace="fragments/dashboard-topbar"></div>
            <main class="dashboard-content">
                <h1>Hồ sơ cửa hàng</h1>
                <form class="shop-form">
                    <div class="form-group">
                        <label>Tên cửa hàng</label>
                        <input type="text" name="shopName" placeholder="Nhập tên cửa hàng">
                    </div>
                    <div class="form-group">
                        <label>Mô tả</label>
                        <textarea name="description" placeholder="Mô tả cửa hàng"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Logo cửa hàng</label>
                        <input type="file" name="logo" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </form>
            </main>
        </div>
    </div>
</body>
</html>
