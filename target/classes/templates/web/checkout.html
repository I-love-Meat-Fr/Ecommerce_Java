<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - CNJ70 Ecommerce</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/web-header"></div>
    
    <main class="main-content">
        <div class="container">
            <h1>Thanh toán</h1>
            
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <form th:action="@{/checkout}" th:object="${checkoutReq}" method="post" class="checkout-form">
                <div class="form-section">
                    <h2>Thông tin giao hàng</h2>
                    
                    <div class="form-group">
                        <label for="shippingAddress">Địa chỉ giao hàng *</label>
                        <textarea id="shippingAddress" th:field="*{shippingAddress}" required 
                                  placeholder="Nhập địa chỉ đầy đủ"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Số điện thoại *</label>
                        <input type="tel" id="phone" th:field="*{phone}" required 
                               placeholder="Nhập số điện thoại">
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Phương thức thanh toán</h2>
                    
                    <div class="payment-methods">
                        <label class="payment-option">
                            <input type="radio" th:field="*{paymentMethod}" value="COD" checked>
                            <span class="payment-name">Thanh toán khi nhận hàng (COD)</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" th:field="*{paymentMethod}" value="VNPAY">
                            <span class="payment-name">Thanh toán qua VNPAY</span>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg">Đặt hàng</button>
            </form>
        </div>
    </main>
    
    <div th:replace="fragments/web-footer"></div>
</body>
</html>
