spring:
  application:
    name: CNJ70 Ecommerce
  
  # MongoDB Configuration - Load from environment or .env file
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://nguyenquocanh170205_db_user:FJGAwn7TMMPkcslN@cluster0.2pu37z6.mongodb.net}
      database: ${MONGODB_DATABASE:cnj70_ecommerce}
      auto-index-creation: true
  
  # Thymeleaf Configuration
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  # Multipart upload
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
  
  # Jackson Configuration
  jackson:
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

# Static resource handling - graceful 404 instead of 500 for missing files
spring.web.resources:
  add-mappings: true
  cache:
    cachecontrol:
      max-age: 3600
  static-locations: classpath:/static/

# Server Configuration
server:
  port: 8081
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong}
  expiration: 86400000  # 24 hours in milliseconds

# Logging
logging:
  level:
    root: INFO
    com.ecommerce.cnj70: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG
